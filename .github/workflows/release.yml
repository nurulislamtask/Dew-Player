name: Release (Windows exe + Android apk)

# Push a tag like v0.2.0 to build and publish a release:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v (example 0.2.0)"
        required: true
      skip_windows:
        description: "Skip the Windows job (only rebuild Android APKs for an existing release)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}
  VELOPACK_VERSION: "0.0.1251"

jobs:
  windows:
    if: ${{ github.event.inputs.skip_windows != 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compute version
        shell: pwsh
        run: |
          $v = "${{ env.VERSION }}".TrimStart('v')
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Generate Windows project
        working-directory: app
        shell: pwsh
        run: |
          flutter create --org com.dewplayer --project-name dew_player --platforms android,windows .
          (Get-Content windows\runner\main.cpp) -replace 'L"dew_player"', 'L"Dew Player"' | Set-Content windows\runner\main.cpp

      - name: Install dependencies and icons
        working-directory: app
        shell: pwsh
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build Windows app
        working-directory: app
        shell: pwsh
        run: flutter build windows --release --build-name $env:APP_VERSION --build-number ${{ github.run_number }}

      - name: Add offline AI engine (whisper.cpp, small CPU build)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $found = $null
          $tags = gh release list --repo ggml-org/whisper.cpp --limit 25 --json tagName --jq '.[].tagName'
          foreach ($t in $tags) {
            $names = @(gh release view $t --repo ggml-org/whisper.cpp --json assets --jq '.assets[].name')
            Write-Host "$t : $($names -join ', ')"
            $hit = $names | Where-Object { $_ -match '^whisper-bin-x64\.zip$' } | Select-Object -First 1
            if ($hit) { $found = @{ tag = $t; name = $hit }; break }
          }
          if (-not $found) { Write-Host "::warning::no whisper.cpp Windows binary found, AI subtitles will be unavailable on Windows"; exit 0 }
          gh release download $found.tag --repo ggml-org/whisper.cpp --pattern $found.name --dir whisper-dl
          Expand-Archive "whisper-dl\$($found.name)" -DestinationPath whisper-dl\x
          $cli = Get-ChildItem whisper-dl\x -Recurse -Filter whisper-cli.exe | Select-Object -First 1
          if (-not $cli) { Write-Host "::warning::whisper-cli.exe not in the archive"; exit 0 }
          $dest = "app\build\windows\x64\runner\Release\whisper"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item "$($cli.Directory.FullName)\*" $dest -Recurse
          Get-ChildItem $dest | Select-Object Name, Length

      - name: Install vpk
        shell: pwsh
        run: dotnet tool install -g vpk --version ${{ env.VELOPACK_VERSION }}

      - name: Download previous release (for delta updates)
        shell: pwsh
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack installer
        shell: pwsh
        run: |
          vpk pack --packId DewPlayer --packVersion $env:APP_VERSION `
            --packDir app\build\windows\x64\runner\Release `
            --mainExe dew_player.exe --packTitle "Dew Player" `
            --icon app\windows\runner\resources\app_icon.ico `
            --framework vcredist143-x64 --outputDir Releases
          Get-ChildItem Releases | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Upload to GitHub Release
        shell: pwsh
        run: |
          vpk upload github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} `
            --outputDir Releases --tag v$env:APP_VERSION --releaseName "Dew Player v$env:APP_VERSION" --publish

  android:
    if: ${{ !cancelled() && (needs.windows.result == 'success' || needs.windows.result == 'skipped') }}
    runs-on: ubuntu-latest
    needs: windows
    steps:
      - uses: actions/checkout@v5

      - name: Compute version
        run: |
          V="${{ env.VERSION }}"; echo "APP_VERSION=${V#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project and patch manifest
        working-directory: app
        run: |
          flutter create --org com.dewplayer --project-name dew_player --platforms android,windows .
          python3 - <<'PY'
          import re, os
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = ('<uses-permission android:name="android.permission.INTERNET"/>\n'
                   '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n'
                   '    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n'
                   '    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n'
                   '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    ')
          s = s.replace("<application", perms + "<application", 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="Dew Player"', s, count=1)
          s = s.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          open(p, "w", encoding="utf-8").write(s)

          # Some plugins still compile against an old SDK but their deps need 36+.
          # Force every plugin subproject (not the app) to compile against SDK 36.
          root = "android/build.gradle.kts" if os.path.exists("android/build.gradle.kts") else "android/build.gradle"
          if root.endswith(".kts"):
              fix = [
                  "",
                  "subprojects {",
                  '    if (name != "app") {',
                  "        afterEvaluate {",
                  '            extensions.findByName("android")?.withGroovyBuilder { "compileSdkVersion"(36) }',
                  "        }",
                  "    }",
                  "}",
                  "",
              ]
          else:
              fix = [
                  "",
                  "subprojects { p ->",
                  "    if (p.name != 'app') {",
                  "        p.afterEvaluate { q ->",
                  "            if (q.hasProperty('android')) { q.android.compileSdkVersion 36 }",
                  "        }",
                  "    }",
                  "}",
                  "",
              ]
          with open(root, "a", encoding="utf-8") as f:
              f.write("\n".join(fix))
          PY

      - name: Install dependencies and icons
        working-directory: app
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Accept Android SDK licenses and install NDK (needed by whisper_flutter_new)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;27.0.11902837"

      - name: Build APKs (per CPU, small size)
        working-directory: app
        run: |
          flutter build apk --release --split-per-abi --build-name "$APP_VERSION" --build-number "${{ github.run_number }}"

      - name: Sign APKs (same key every release, so updates install over the old app)
        run: |
          KS="$GITHUB_WORKSPACE/app/signing/dew-release.jks"
          PASS="dewplayer-pass"
          ALIAS="dew"
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
            KS="$RUNNER_TEMP/release.jks"; PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"; ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          cd app/build/app/outputs/flutter-apk
          mkdir -p "$GITHUB_WORKSPACE/out"
          for pair in "arm64-v8a:arm64" "armeabi-v7a:armv7"; do
            abi="${pair%%:*}"; name="${pair##*:}"
            "$BT/zipalign" -f -p 4 "app-$abi-release.apk" "aligned-$name.apk"
            "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$PASS" --ks-key-alias "$ALIAS" --key-pass "pass:$PASS" \
              --out "$GITHUB_WORKSPACE/out/DewPlayer-android-$name.apk" "aligned-$name.apk"
          done
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Add APKs to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          files: out/*.apk
