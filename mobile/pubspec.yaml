name: dew_player
description: Dew Player - a light and smooth subtitle-first video player.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.6
  file_picker: ^8.1.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  package_info_plus: ^8.0.2
  device_info_plus: ^10.1.2
  wakelock_plus: ^1.2.8
  whisper_flutter_new: ^1.0.1
  google_mlkit_text_recognition: ">=0.13.0 <1.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
